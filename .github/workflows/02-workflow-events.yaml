name: 02 - Workflow Events
on: 
    push:
    pull_request:
    schedule:
        - cron: '*/5 * * * *'
    workflow_dispatch:

jobs:
    echo:
        runs-on: ubuntu-latest
        steps:
            - name: Show the trigger
              env:
                EVENT_NAME: ${{ github.event_name }}
              run: |
               echo "Event name: $EVENT_NAME"
