name: 04 - Using Actions

on:
    push:

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: 04-using-actions/new-react-app
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
            
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                node-version: '25.x'
            
            - name: Install Dependencies
              run: npm ci
            
            - name: Run unit Tests
              run: npm runtest
