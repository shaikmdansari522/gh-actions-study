name: 03 - Workflow Runners

on: 
    push:

jobs:
    ubuntu-echo:
        runs-on: ubuntu-latest
        steps:
            - name: Show OS
              run: |
                echo "This job is running on an Ubuntu runner."
                echo ${{ runner.os }}
    
    windows-echo:
        runs-on: windows-latest
        steps:
            - name: Show OS
              env:
                RUNNER_OS: ${{ runner.os }}
              run: |
                Write-Output "This job is running on a Windows runner."
                Write-Output "$RUNNER_OS"
    
    mac-echo:
        runs-on: macos-latest
        steps:
            - name: Show OS
              env:
                RUNNER_OS: ${{ runner.os }}
              run: |
                 echo "This job is running on an macos runner."
                 echo $RUNNER_OS

